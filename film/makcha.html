<title>막차</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  /* Layout: one screening column. Title, the film, then a subway-line timeline that doubles as the scrubber. */
  --bg:#070A13;
  --surface:#0E1424;
  --rule:#1D2740;
  --fg:#E8EBF1;
  --muted:#8A93A7;
  --neon:#62D6C9;
  --lamp:#FF5A2B;
  --font-display:"Do Hyeon","IBM Plex Sans KR",system-ui,sans-serif;
  --font-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --font-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:18px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 20px}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,8vw,72px);line-height:.95;margin:0;letter-spacing:.02em;text-wrap:balance}
.meta{color:var(--muted);font-size:14px;margin:0}
.stage{position:relative;width:100%;max-width:100%;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;box-shadow:0 0 0 1px var(--rule),0 40px 90px -50px rgba(98,214,201,.35)}
.stage canvas{display:block;width:100%;height:100%;cursor:pointer}
.stage:fullscreen{border-radius:0;display:flex;align-items:center;justify-content:center;aspect-ratio:auto;width:100vw;height:100vh;box-shadow:none}
.stage:fullscreen canvas{width:min(100vw,177.78vh);height:auto;aspect-ratio:16/9}
.cover{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;border:0;padding:0;margin:0;background:linear-gradient(180deg,rgba(7,10,19,.1),rgba(7,10,19,.62));color:var(--fg);cursor:pointer;font:inherit}
.disc{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;background:rgba(255,90,43,.14);border:2px solid var(--lamp);box-shadow:0 0 30px rgba(255,90,43,.45)}
.disc svg{width:30px;height:30px;margin-left:4px;fill:var(--fg)}
.cover-label{font-weight:600;font-size:16px}
.cover-sub{color:var(--muted);font-size:13px;margin-top:-6px}
.cover:focus-visible{outline:2px solid var(--neon);outline-offset:-4px}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.btn{height:40px;min-width:40px;padding:0 14px;border-radius:999px;border:1px solid var(--rule);background:var(--surface);color:var(--fg);font:500 14px/1 var(--font-body);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.btn:hover{border-color:#2E3C5E}
.btn:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.btn svg{width:18px;height:18px;fill:currentColor;flex:none}
.btn.primary{border-color:rgba(255,90,43,.65)}
.status{font-size:13px;color:var(--muted)}
.time{margin-left:auto;font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.time b{color:var(--fg);font-weight:500}
.line{position:relative;height:92px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;outline:none}
.rail{position:absolute;left:18px;right:18px;top:0;bottom:0}
.track{position:absolute;left:0;right:0;top:46px;height:6px;margin-top:-3px;border-radius:3px;background:var(--rule)}
.line:focus-visible .track{box-shadow:0 0 0 2px var(--neon)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--neon)}
.st{position:absolute;top:46px;width:0;height:0}
.st i{position:absolute;left:-7px;top:-7px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--rule)}
.st.past i{border-color:var(--neon)}
.st.now i{background:var(--neon);border-color:var(--neon)}
.st span{position:absolute;left:0;transform:translateX(-50%);white-space:nowrap;font-size:12px;line-height:1.25;color:var(--muted);text-align:center}
.st span em{display:block;font-style:normal;font-family:var(--font-mono);font-size:10px;letter-spacing:.04em;opacity:.8}
.st.up span{bottom:13px}
.st.down span{top:13px}
.st.now span{color:var(--fg)}
.knob{position:absolute;top:46px;left:0;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:var(--lamp);box-shadow:0 0 0 3px rgba(255,90,43,.25),0 0 16px rgba(255,90,43,.8);pointer-events:none}
.now-shot{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin:0;min-height:1.6em}
.now-shot .id{font-family:var(--font-mono);font-size:12px;color:var(--neon);letter-spacing:.06em}
.now-shot .txt{font-size:15px;min-width:0}
.foot{color:var(--muted);font-size:13px;border-top:1px solid var(--rule);padding-top:14px;margin:4px 0 0;max-width:65ch}
@media (max-width:560px){.btn .lbl{display:none}.btn{padding:0 11px}.time{font-size:12px}}
@media (prefers-reduced-motion:reduce){.disc{box-shadow:none}}
</style>

<div class="wrap">
  <header class="head">
    <h1>막차</h1>
    <p class="meta">20초 · 16:9 · 대사 없음 · 2D 애니메이션</p>
  </header>

  <div class="stage" id="stage">
    <canvas id="film" role="img" aria-label="애니메이션 막차: 배달 로봇이 상자를 안고 막차를 쫓는 이야기"></canvas>
    <button class="cover" id="cover" type="button">
      <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg></span>
      <span class="cover-label" id="coverLabel">재생</span>
      <span class="cover-sub" id="coverSub">소리를 켜고 보세요</span>
    </button>
  </div>

  <div class="controls">
    <button class="btn primary" id="playBtn" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="playIcon" d="M7 4.5v15l12.5-7.5z"/></svg><span class="lbl" id="playLbl">재생</span>
    </button>
    <button class="btn" id="restartBtn" type="button" aria-label="처음부터">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4V1L7 5l5 4V6a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg><span class="lbl">처음부터</span>
    </button>
    <button class="btn" id="muteBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path id="muteIcon" d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06A9 9 0 0 0 14 3.23z"/></svg><span class="lbl" id="muteLbl">소리 켜짐</span>
    </button>
    <button class="btn" id="fsBtn" type="button" aria-label="전체 화면">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg><span class="lbl">전체 화면</span>
    </button>
    <span class="status" id="status" aria-live="polite"></span>
    <span class="time"><b id="cur">00:00.0</b> / 00:20.0</span>
  </div>

  <div class="line" id="line" role="slider" tabindex="0" aria-label="재생 위치" aria-valuemin="0" aria-valuemax="20" aria-valuenow="0" aria-valuetext="0초">
    <div class="rail" id="rail">
      <div class="track"><div class="fill" id="fill"></div></div>
      <div class="knob" id="knob"></div>
    </div>
  </div>

  <p class="now-shot"><span class="id" id="shotId">SHOT 01 · 추격</span><span class="txt" id="shotTxt">닫히는 문, 상자를 안고 달려오는 배달 로봇</span></p>

  <p class="foot">Shotkit 스토리보드의 샷 7개를 그대로 따라 그렸어요. 그림은 캔버스 코드로 그리고, 재즈 드럼부터 고양이 울음까지 소리는 Web Audio로 합성했어요. 이미지나 녹음 파일은 하나도 쓰지 않았어요. 스페이스로 재생과 멈춤, 화살표로 1초씩 이동해요.</p>
</div>
<script>
(() => {
'use strict';
/* ---------- constants ---------- */
const W = 1920, H = 1080, DUR = 20;
const INK = '#0E121B';
const P = {
  robot: '#F3F2EE', robotShade: '#D6D0C4', robotDeep: '#BAB3A6', screen: '#10141D', eye: '#F3F2EE',
  orange: '#FF5A2B',
  box: '#B5824F', boxShade: '#976A3D', boxTop: '#C8975F', tape: '#D8B47C', hole: '#3A2614',
  cat: '#8F949C', catShade: '#777C85', catStripe: '#5C616A', catWhite: '#F1EFEA', catEye: '#8CCB6E', catPink: '#E9A3A0', catMouth: '#6E2F35'
};
// story clock (seconds). Shot boundaries: 0 / 3 / 7 / 11 / 13 / 16 / 18
const T = {
  doorStart: 0.4, doorShut: 7.05, enter: 0.9, accel: 3.0, slip: 6.2, release: 6.27, land: 6.45,
  impact: 7.15, sitUp: 7.3, catchT: 8.05, depart: 8.8, gone: 10.9, ret0: 13.0, ret1: 15.0,
  open0: 15.15, open1: 15.7, stand0: 16.0, hop0: 16.45, hop1: 17.05, turn0: 17.25, turn1: 17.5,
  close0: 17.5, cu: 18.0, black: 19.6
};
const GROUND = 930, DOOR_FLOOR = 806, DOOR_OFF = 1650, CAR_LEN = 3600;
const XL0 = -300, XLR = -445, RET_START = 1960, SEAT_X = 1205, SLIDE = 55;
const ACC = 2 * 2280 / (2.1 * 2.1);
const V1 = 196, V2 = 353, F1 = 3.0, F2 = 4.2;
const ARM_N = -1.15, ARM_F = -1.0;
const RS = 1.3; // robot scale in the wide shots
const WINDOWS = [300, 570, 840, 1110, 1380, 1920, 2190, 2460, 2730, 3000];
const NEON_SEGS = [[70, 560], [700, 1220], [1360, 1850]];
const SHOTS = [
  { id: '01', beat: '추격', t: 0, txt: '닫히는 문, 상자를 안고 달려오는 배달 로봇' },
  { id: '02', beat: '미끄러짐', t: 3, txt: '문 앞에서 미끄러져 뒤로 벌러덩, 상자는 앞으로' },
  { id: '03', beat: '놓침', t: 7, txt: '상자는 닫힌 문에 툭, 다시 로봇 품으로. 열차는 떠난다' },
  { id: '04', beat: '정적', t: 11, txt: '텅 빈 승강장, 아무 소리도 없다' },
  { id: '05', beat: '반전', t: 13, txt: '떠났던 열차가 슬금슬금 후진해 돌아온다' },
  { id: '06', beat: '탑승', t: 16, txt: '열린 문으로 깡충' },
  { id: '07', beat: '펀치라인', t: 18, txt: '상자 뚜껑이 들리고 빼꼼, 냐옹' }
];

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, u) => a + (b - a) * u;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = u => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
const eis = u => 0.5 - 0.5 * Math.cos(Math.PI * u);
const eoc = u => 1 - Math.pow(1 - u, 3);
const eic = u => u * u * u;
const eob = u => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(u - 1, 3) + c1 * Math.pow(u - 1, 2); };
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, u) { const x = hexRgb(a), y = hexRgb(b); return `rgb(${Math.round(lerp(x[0], y[0], u))},${Math.round(lerp(x[1], y[1], u))},${Math.round(lerp(x[2], y[2], u))})`; }
function qb(p0, c, p1, u) { const v = 1 - u; return [v * v * p0[0] + 2 * u * v * c[0] + u * u * p1[0], v * v * p0[1] + 2 * u * v * c[1] + u * u * p1[1]]; }

/* ---------- run ---------- */
function runDist(t) {
  if (t <= T.enter) return V1 * (t - T.enter);
  let d = V1 * (Math.min(t, T.accel) - T.enter);
  if (t > T.accel) { const u = Math.min(t, T.slip) - T.accel; d += V1 * u + 0.5 * (V2 - V1) / (T.slip - T.accel) * u * u; }
  return d;
}
function runCycles(t) {
  if (t <= T.enter) return 0;
  let c = F1 * (Math.min(t, T.accel) - T.enter);
  if (t > T.accel) { const u = Math.min(t, T.slip) - T.accel; c += F1 * u + 0.5 * (F2 - F1) / (T.slip - T.accel) * u * u; }
  return c;
}

/* ---------- train ---------- */
function trainXL(t) {
  if (t < T.depart) return XL0;
  if (t < T.gone) { const u = t - T.depart; return XL0 + 0.5 * ACC * u * u; }
  if (t < T.ret0) return null;
  if (t < T.ret1) return lerp(RET_START, XLR, eis(seg(t, T.ret0, T.ret1)));
  const u = t - T.ret1;
  return XLR - 7 * Math.exp(-u * 7) * Math.sin(u * 20);
}
function trainVel(t) {
  const a = trainXL(t - 0.005), b = trainXL(t + 0.005);
  return a == null || b == null ? 0 : (b - a) / 0.01;
}
function doorOpen(t) {
  if (t < T.doorStart) return 1;
  if (t < T.doorShut) return 1 - eis(seg(t, T.doorStart, T.doorShut));
  if (t < T.open0) return 0;
  if (t < T.close0) return eoc(seg(t, T.open0, T.open1));
  return 1 - 0.38 * eio(seg(t, T.close0, T.cu));
}

/* ---------- robot pose ---------- */
function lowest(rot) {
  const s = Math.sin(rot), c = Math.cos(rot);
  let m = -1e9;
  for (const [x, y] of [[-6, -46], [6, -46], [-6, -90], [6, -90]]) m = Math.max(m, x * s + y * c);
  return m + 46;
}
function settle(r) {
  r.bodyY = lerp(-30, -4, r.sit);
  const low = lowest(r.rot);
  if (r.bodyY + low > 0) r.bodyY = -low;
  return r;
}
function bodyToWorld(r, px, py) {
  const sx = 1 + (1 - r.squash) * 0.55, sy = r.squash;
  const X = px * sx, Y = py * sy, c = Math.cos(r.rot), s = Math.sin(r.rot);
  return [r.x + r.s * (X * c - Y * s), r.y + r.s * (r.bodyY + r.bob + X * s + Y * c)];
}
function holdWorld(r) { return bodyToWorld(r, lerp(0, 60, r.face), lerp(-50, -56, r.face)); }
function sitBase(r) { r.sit = 1; r.legA = -1.5; r.legB = -1.15; r.armN = ARM_N; r.armF = ARM_F; r.held = true; r.x = SEAT_X; }

function robotState(t) {
  const r = { t, x: SEAT_X, y: GROUND, s: RS, rot: 0, sit: 0, legA: 0, legB: 0, bob: 0, squash: 1, armN: ARM_N, armF: ARM_F,
    eyes: 'dot', edx: 6, edy: 0, eopen: 1, face: 1, held: true, ant: 0, lamp: 1, layer: 'platform', bodyY: -30 };
  if (t < T.slip) {
    r.x = -140 + runDist(t);
    const ph = runCycles(t) * Math.PI * 2, sw = Math.sin(ph), acc = seg(t, T.accel, T.slip);
    r.legA = 0.85 * sw; r.legB = -0.85 * sw; r.bob = 5 * Math.abs(sw);
    r.rot = 0.1 + 0.08 * acc; r.ant = -0.3 - 0.1 * Math.sin(2 * ph) - 0.15 * acc;
    r.armN = ARM_N + 0.08 * Math.sin(2 * ph); r.armF = ARM_F + 0.08 * Math.sin(2 * ph);
    r.edx = 7; r.edy = -1; if (t > 4.8) r.eyes = 'big';
  } else if (t < T.land) {
    const u = seg(t, T.slip, T.land), sw = Math.sin(runCycles(T.slip) * Math.PI * 2), k = eoc(seg(t, T.slip, 6.3));
    r.x = 1150 + SLIDE * eoc(seg(t, T.slip, 6.55));
    r.legA = lerp(0.85 * sw, -1.55, k); r.legB = lerp(-0.85 * sw, -1.2, k);
    r.rot = lerp(0.18, -0.6, eic(u)); r.sit = eic(seg(t, 6.25, T.land));
    r.armN = lerp(ARM_N, -2.7, k); r.armF = lerp(ARM_F, 2.6, k);
    r.held = t < T.release; r.eyes = 'big'; r.edx = 2; r.edy = -4; r.ant = lerp(-0.45, 0.7, u);
  } else if (t < T.sitUp) {
    sitBase(r); r.held = false; r.x = 1150 + SLIDE * eoc(seg(t, T.slip, 6.55));
    r.rot = lerp(-0.6, -1.05, eob(seg(t, T.land, 6.75)));
    const w = 1 - seg(t, T.land, 6.85);
    r.legA = -1.55 + 0.25 * Math.sin((t - T.land) * 38) * w; r.legB = -1.2 + 0.25 * Math.sin((t - T.land) * 38 + 1.6) * w;
    const ka = eoc(seg(t, T.land, 6.7)); r.armN = lerp(-2.7, -0.5, ka); r.armF = lerp(2.6, 0.6, ka);
    r.squash = 1 - 0.12 * (1 - seg(t, T.land, 6.6));
    r.eyes = t < 6.53 ? 'squeeze' : 'swirl'; r.edx = 0; r.edy = 0;
    r.ant = 0.7 * Math.cos((t - T.land) * 16) * Math.exp(-(t - T.land) * 4);
  } else if (t < T.catchT) {
    sitBase(r); r.held = false;
    r.rot = lerp(-1.05, -0.06, eob(seg(t, T.sitUp, 7.55)));
    const ka = eio(seg(t, 7.45, 7.8)); r.armN = lerp(-0.5, -2.2, ka); r.armF = lerp(0.6, -1.9, ka);
    r.eyes = 'big'; r.ant = -0.18 * Math.sin(Math.PI * seg(t, T.sitUp, 7.6));
    settle(r);
    const b = boxState(t), f = bodyToWorld(r, 15, -90);
    r.edx = clamp((b.x - f[0]) / 30, -6, 9); r.edy = clamp((b.y - f[1]) / 30, -7, 7);
    return r;
  } else if (t < T.depart) {
    sitBase(r);
    r.rot = -0.06 - 0.14 * Math.sin(Math.PI * seg(t, T.catchT, 8.35));
    r.squash = 1 - 0.1 * Math.sin(Math.PI * seg(t, T.catchT, 8.25));
    const ka = eoc(seg(t, T.catchT, 8.15)); r.armN = lerp(-2.2, ARM_N, ka); r.armF = lerp(-1.9, ARM_F, ka);
    if (t < 8.12) { r.eyes = 'big'; r.edx = 4; r.edy = -3; }
    else if (t < 8.58) { r.eyes = 'happy'; r.edx = 2; r.edy = 0; }
    else { r.eyes = 'dot'; r.edx = 7; r.edy = -1; }
  } else if (t < T.ret0) {
    sitBase(r);
    r.rot = lerp(-0.06, 0.07, eio(seg(t, 9.2, 11.2)));
    r.lamp = lerp(1, 0.4, seg(t, 9.4, 11.2)); r.ant = lerp(0, 0.55, eio(seg(t, 9.4, 11.4)));
    if (t < T.gone) { r.eyes = 'big'; r.edx = lerp(7, 10, seg(t, T.depart, 9.6)); r.edy = -1; }
    else {
      r.eyes = 'dot'; r.edx = 8; r.edy = 2; r.eopen = lerp(1, 0.5, seg(t, T.gone, 11.4));
      const bl = seg(t, 12.15, 12.45); if (bl > 0 && bl < 1) r.eopen = 0.5 * (1 - Math.sin(Math.PI * bl)) + 0.04;
    }
  } else if (t < T.open0) {
    sitBase(r);

  startPos = pos; perf0 = performance.now() + 40;
  if (actx && audioBuf) {
    src = actx.createBufferSource(); src.buffer = audioBuf; src.connect(gainN);
    acStart = actx.currentTime + 0.04; src.start(acStart, Math.min(pos, DUR - 0.01));
  } else src = null;

}
function halt() { if (src) { try { src.stop(); } catch (e) { /* already stopped */ } try { src.disconnect(); } catch (e) { /* ignore */ } src = null; } }

  const was = playing; if (was) pause();

  if (was && !ended) play();
}
function toggle() { if (playing) pause(); else play(); }
function toggleMute() {
  muted = !muted; if (gainN) gainN.gain.value = muted ? 0 : 1;
  $('muteIcon').setAttribute('d', muted ? ICON_MUTE : ICON_SND);
  $('muteLbl').textContent = muted ? '소리 꺼짐' : '소리 켜짐';
  $('muteBtn').setAttribute('aria-pressed', String(muted));
}

$('cover').addEventListener('click', () => play());
cv.addEventListener('click', toggle);
$('playBtn').addEventListener('click', toggle);
$('restartBtn').addEventListener('click', () => { const was = playing || initial || ended; pause(); initial = false; pos = 0; ended = false; render(); if (was) play(); });
$('muteBtn').addEventListener('click', toggleMute);
const fsBtn = $('fsBtn');
if (!stage.requestFullscreen) fsBtn.hidden = true;
fsBtn.addEventListener('click', async () => {
  try { if (document.fullscreenElement) await document.exitFullscreen(); else await stage.requestFullscreen(); }
  catch (e) { status('이 화면에서는 전체 화면을 쓸 수 없어요'); setTimeout(() => status(''), 2500); }
});
document.addEventListener('fullscreenchange', () => requestAnimationFrame(fit));

let dragging = false, wasPlaying = false;
function scrub(e, snap) {
  const r = rail.getBoundingClientRect();
  let t = clamp((e.clientX - r.left) / r.width) * DUR;
  if (snap) for (const s of SHOTS) if (Math.abs((s.t - t) / DUR * r.width) < 12) t = s.t;
  initial = false; pos = t; ended = pos >= DUR; render();
}
line.addEventListener('pointerdown', e => { dragging = true; wasPlaying = playing; if (playing) pause(); try { line.setPointerCapture(e.pointerId); } catch (x) { /* ignore */ } scrub(e, true); });
line.addEventListener('pointermove', e => { if (dragging) scrub(e, false); });

line.addEventListener('pointerup', endDrag);
line.addEventListener('pointercancel', endDrag);
line.addEventListener('keydown', e => {
  const step = e.shiftKey ? 0.1 : 1, k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowUp') seek(pos + step);
  else if (k === 'ArrowLeft' || k === 'ArrowDown') seek(pos - step);
  else if (k === 'Home') seek(0);
  else if (k === 'End') seek(DUR);
  else if (k === ' ') toggle();
  else return;
  e.preventDefault();
});
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button,input,textarea,select,[role=slider]')) return;
  if (e.key === ' ' || e.key === 'k') { e.preventDefault(); toggle(); }
  else if (e.key === 'm') toggleMute();
  else if (e.key === 'ArrowRight') { e.preventDefault(); seek(pos + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(pos - 1); }
});
if (window.ResizeObserver) new ResizeObserver(() => requestAnimationFrame(fit)).observe(cv);
else window.addEventListener('resize', fit);
fit();

/* used to render the MP4 outside the browser UI */
window.__film = {
  W, H, DUR,
  setupExport() { const c = document.createElement('canvas'); c.width = W; c.height = H; this.cv = c; this.cx = c.getContext('2d'); this.L = buildLayers(W, H); },
  exportFrame(t, type) { const c = this.cx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, W, H); drawFrame(c, t, this.L); return this.cv.toDataURL(type || 'image/png').split(',')[1]; },
  async wavBase64() { const b = await audioReady; return b ? encodeWav(b) : null; }
};
})();
</script>
